<style id="sf-movie-lesson-refinement">
.sf-movie-lesson-player{background:#f5f7fb;border-radius:18px;overflow:hidden}
.sf-movie-lesson-player .video-wrap{border-radius:0;overflow:hidden}
.sf-movie-lesson-player .sf-clip-controls button{font-size:14px}
.sf-movie-lesson-player .sf-mobile-captions-outside{border-radius:16px;margin:12px 10px;background:#fff;min-height:72px;box-shadow:0 2px 12px rgba(24,55,43,.07)}
.sf-movie-lesson-player .sf-subtitle-offset{background:#fff!important;border-radius:16px;margin:10px!important;gap:12px!important;padding:14px!important;box-shadow:0 2px 12px rgba(24,55,43,.06)}
.sf-movie-lesson-player .sf-subtitle-offset button{border:0;border-radius:50%;background:#e8f7ee;color:#238050;font-size:22px;min-width:42px;height:42px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.sf-movie-lesson-player .sf-subtitle-offset .sf-offset-reset{border-radius:12px;font-size:13px;background:#f0f3f6;color:#54606d;padding:0 12px}
.sf-movie-lesson-player .sf-subtitle-offset .sf-offset-label{font-size:20px;font-weight:700;color:#259b63;min-width:62px;text-align:center}
@media(max-width:480px){.sf-movie-lesson-player .sf-clip-controls{gap:5px!important;padding:9px 6px!important}.sf-movie-lesson-player .sf-clip-controls button{font-size:12px!important;padding:8px 5px!important;min-height:40px!important}.sf-movie-lesson-player .sf-clip-controls span{font-size:11px!important}.sf-movie-lesson-player .sf-subtitle-offset{gap:9px!important}.sf-movie-lesson-player .sf-subtitle-offset>span:last-child{font-size:12px}}
.sf-movie-lesson-player .sf-mobile-captions-outside .sf-mobile-caption-line{color:#343a40!important;font-weight:500!important;text-shadow:none!important}
.sf-movie-lesson-player .video-caption{color:#343a40!important;text-shadow:none!important}
</style>
<style id="sf-movie-toolbar-v2">.sf-movie-lesson-player .sf-lesson-toolbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:#fff;padding:10px 5px;border-radius:0 0 18px 18px}.sf-movie-lesson-player .sf-lesson-toolbar button{border:0;background:#f6f8fa;border-radius:12px;min-width:0;padding:9px 0;color:#28774c;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.sf-movie-lesson-player .sf-lesson-toolbar span{font-size:22px}.sf-movie-lesson-player .sf-lesson-toolbar small{font-size:11px}.sf-movie-lesson-player .sf-lesson-toolbar button:disabled{opacity:.35}.sf-movie-lesson-player .sf-lesson-toolbar button[aria-pressed=true]{background:#e0f4e8}.sf-movie-lesson-player .sf-mobile-captions-outside[hidden],.sf-movie-lesson-player .sf-subtitle-offset[hidden]{display:none!important}@media(max-width:430px){.sf-movie-lesson-player .sf-lesson-toolbar{gap:2px;padding:7px 2px}.sf-movie-lesson-player .sf-lesson-toolbar span{font-size:19px}.sf-movie-lesson-player .sf-lesson-toolbar small{font-size:10px}}</style></head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home" aria-label="首页">
        <span>
          <strong>English Story Learning</strong>
          <small>一起学英语</small>
        </span>
      </a>
      <nav class="utility-nav" aria-label="学习工具">
        <a href="#/checkin" id="navCheckin" aria-label="签到" title="签到">
          <img class="utility-image" src="assets/icons/checkin.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
        <a href="#/homework" id="navHomework" aria-label="打卡作业" title="打卡作业">
          <img class="utility-image" src="assets/icons/homework.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
          <span id="homeworkBadge" class="homework-count" hidden></span>
        </a>
        <a href="#/rewards" id="navRewards" aria-label="积分奖励" title="积分奖励">
          <img class="utility-image" src="assets/icons/rewards.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
          <span class="nav-points-badge">0</span>
        </a>
        <a href="#/honors" id="navHonors" aria-label="我的荣誉馆" title="我的荣誉馆">
          <img class="utility-image" src="assets/icons/honors.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
        <a href="#/account" id="accountLink" aria-label="注册 / 登录" title="注册 / 登录">
          <img class="utility-image" src="assets/icons/account.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
      </nav>
    </div>
    <div class="main-nav">
      <div class="main-nav-inner">
        <div class="main-tabs"><a class="main-tab active" href="#/home"><img class="main-tab-icon" src="assets/nav-icons/animation-story.png" alt="" aria-hidden="true" width="30" height="30" decoding="async" /><span>动画故事</span></a><a class="main-tab" href="#/movies"><img class="main-tab-icon" src="assets/nav-icons/movie-class.png" alt="" aria-hidden="true" width="30" height="30" decoding="async" /><span>光影课堂</span></a><a class="main-tab" href="#/reading"><img class="main-tab-icon" src="assets/nav-icons/picture-books.png" alt="" aria-hidden="true" width="30" height="30" decoding="async" /><span>绘本阅读</span></a><a class="main-tab" href="#/magazines"><img class="main-tab-icon" src="assets/nav-icons/periodicals.png" alt="" aria-hidden="true" width="30" height="30" decoding="async" /><span>期刊杂志</span></a><a class="main-tab" href="/source-lab/"><img class="main-tab-icon" src="assets/nav-icons/source-search.png" alt="" aria-hidden="true" width="30" height="30" decoding="async" /><span>片源探索</span></a></div>
        <div class="search-box">
          <input id="globalSearch" type="search" placeholder="搜索故事、单词或集数" autocomplete="off" aria-autocomplete="list" aria-controls="globalSearchSuggestions" aria-expanded="false" />
          <button id="searchBtn" type="button" aria-label="搜索">🔍</button>
          <div id="globalSearchSuggestions" class="search-suggestions" role="listbox" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <aside id="homeworkReminder" class="homework-reminder" role="status" aria-live="polite" hidden></aside>
  <main id="app" class="app-shell"></main>

  <footer class="footer">
    <div>Story Fox English · Local learning platform</div>
    <div>Watch · Listen and Read · Words · Quiz · Games</div>
  </footer>

  <div id="accountDialog" class="account-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <section class="account-box">
      <div class="account-bar"><strong id="accountTitle">Story Fox · 我的账户</strong><button type="button" id="accountClose" aria-label="关闭">×</button></div>
      <p id="syncState" class="account-sync">游客模式 · 记录仅在本设备</p>
      <div id="accountNotice" class="account-notice" role="status" aria-live="polite"></div>
      <div class="account-modes"><button type="button" id="accountLogin" data-auth-mode="login">登录</button><button type="button" id="accountSignup" data-auth-mode="signup">注册</button><button type="button" id="accountReset" data-auth-mode="reset">忘记密码</button></div>
      <form id="accountForm">
        <div id="authNicknameRow" hidden><label for="accountNickname">账号昵称</label><input id="accountNickname" minlength="2" maxlength="40" autocomplete="nickname" placeholder="2–40 个字，公开显示"></div>
        <div id="authEmailRow"><label for="accountEmail">邮箱</label><input id="accountEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div id="authPasswordRow"><label for="accountPassword">密码</label><input id="accountPassword" type="password" minlength="8" autocomplete="current-password" placeholder="至少 8 位"></div>
        <button class="account-primary" id="accountSubmit" type="submit">登录</button>
      </form>
      <div id="accountActions" hidden><p id="accountEmailLabel"></p><form id="accountNicknameForm"><label for="accountProfileNickname">账号昵称</label><input id="accountProfileNickname" required minlength="2" maxlength="40" autocomplete="nickname" placeholder="设置公开昵称"><button type="submit">保存昵称</button></form><p class="account-library-links"><a href="#/reading/mine/uploads" id="accountMyBooks">管理我的绘本</a><a href="#/magazines/mine/uploads" id="accountMyMagazines">管理我的期刊</a></p><div id="familyAccountSettings"></div><div class="account-data-actions"><button type="button" id="accountSync">立即同步</button><button type="button" id="accountImport">导入本设备游客记录</button><button type="button" id="accountLogout">退出账户</button></div></div>
      <small class="account-footnote">登录后同步学习进度、测验、收藏和积分；未登录仍可作为游客学习。</small>
    </section>
  </div>
