  <meta name="referrer" content="no-referrer" />
  <title>English Story Learning</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdn.littlefox.co.kr" crossorigin />
  <link rel="stylesheet" href="css/family.css?v=20261027-reminder-1" />
  <link rel="stylesheet" href="css/style.css?v=20261106-nav-icons-2" />
  <link rel="stylesheet" href="css/utility-icons.css?v=20261106-1" />

</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home" aria-label="首页">
        <span>
          <strong>English Story Learning</strong>
          <small>一起学英语</small>
        </span>
      </a>
      <nav class="utility-nav" aria-label="学习工具">
        <a href="#/checkin" id="navCheckin" aria-label="签到" title="签到">
          <img class="utility-image" src="assets/icons/checkin.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
        <a href="#/homework" id="navHomework" aria-label="打卡作业" title="打卡作业">
          <img class="utility-image" src="assets/icons/homework.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
          <span id="homeworkBadge" class="homework-count" hidden></span>
        </a>
        <a href="#/rewards" id="navRewards" aria-label="积分奖励" title="积分奖励">
          <img class="utility-image" src="assets/icons/rewards.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
          <span class="nav-points-badge">0</span>
        </a>
        <a href="#/honors" id="navHonors" aria-label="我的荣誉馆" title="我的荣誉馆">
          <img class="utility-image" src="assets/icons/honors.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
        <a href="#/account" id="accountLink" aria-label="注册 / 登录" title="注册 / 登录">
          <img class="utility-image" src="assets/icons/account.webp" alt="" aria-hidden="true" width="48" height="48" decoding="async" />
        </a>
      </nav>
    </div>
    <div class="main-nav">
      <div class="main-nav-inner">
        <div class="main-tabs"><a class="main-tab active" href="#/home">📖 动画故事</a><a class="main-tab" href="#/movies">🎬 光影课堂</a><a class="main-tab" href="#/reading">📚 绘本阅读</a><a class="main-tab" href="#/magazines">📰 期刊杂志</a><a class="main-tab" href="/source-lab/">🔎 片源探索</a></div>
        <div class="search-box">
          <input id="globalSearch" type="search" placeholder="搜索故事、单词或集数" autocomplete="off" aria-autocomplete="list" aria-controls="globalSearchSuggestions" aria-expanded="false" />
          <button id="searchBtn" type="button" aria-label="搜索">🔍</button>
          <div id="globalSearchSuggestions" class="search-suggestions" role="listbox" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <aside id="homeworkReminder" class="homework-reminder" role="status" aria-live="polite" hidden></aside>
  <main id="app" class="app-shell"></main>

  <footer class="footer">
    <div>Story Fox English · Local learning platform</div>
    <div>Watch · Listen and Read · Words · Quiz · Games</div>
  </footer>

  <div id="accountDialog" class="account-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <section class="account-box">
      <div class="account-bar"><strong id="accountTitle">Story Fox · 我的账户</strong><button type="button" id="accountClose" aria-label="关闭">×</button></div>
      <p id="syncState" class="account-sync">游客模式 · 记录仅在本设备</p>
      <div id="accountNotice" class="account-notice" role="status" aria-live="polite"></div>
      <div class="account-modes"><button type="button" id="accountLogin" data-auth-mode="login">登录</button><button type="button" id="accountSignup" data-auth-mode="signup">注册</button><button type="button" id="accountReset" data-auth-mode="reset">忘记密码</button></div>
      <form id="accountForm">
        <div id="authNicknameRow" hidden><label for="accountNickname">账号昵称</label><input id="accountNickname" minlength="2" maxlength="40" autocomplete="nickname" placeholder="2–40 个字，公开显示"></div>
        <div id="authEmailRow"><label for="accountEmail">邮箱</label><input id="accountEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div id="authPasswordRow"><label for="accountPassword">密码</label><input id="accountPassword" type="password" minlength="8" autocomplete="current-password" placeholder="至少 8 位"></div>
        <button class="account-primary" id="accountSubmit" type="submit">登录</button>
      </form>
      <div id="accountActions" hidden><p id="accountEmailLabel"></p><form id="accountNicknameForm"><label for="accountProfileNickname">账号昵称</label><input id="accountProfileNickname" required minlength="2" maxlength="40" autocomplete="nickname" placeholder="设置公开昵称"><button type="submit">保存昵称</button></form><p class="account-library-links"><a href="#/reading/mine/uploads" id="accountMyBooks">管理我的绘本</a><a href="#/magazines/mine/uploads" id="accountMyMagazines">管理我的期刊</a></p><div id="familyAccountSettings"></div><div class="account-data-actions"><button type="button" id="accountSync">立即同步</button><button type="button" id="accountImport">导入本设备游客记录</button><button type="button" id="accountLogout">退出账户</button></div></div>
      <small class="account-footnote">登录后同步学习进度、测验、收藏和积分；未登录仍可作为游客学习。</small>
    </section>
  </div>
  <script src="js/supabase-config.js"></script>
  <script src="js/cloud-account.js?v=20261106-utility-icons-fix-1"></script>
  <script src="js/read-dictionary.js?v=20261104-study-collections-1"></script>
  <script src="js/client-protection.js?v=20261101-1"></script>
  <script src="js/dytt-ad-skip.js?v=20261017-1"></script>
  <script src="source-lab/core.js?v=20261030-dulo-session"></script>
  <script src="js/movie-subtitles.js?v=20261020-1"></script>
  <script src="js/movies.js?v=20261106-dynamic-library-5"></script>

  <script src="js/book-community.js?v=20261104-storage-private-1"></script>
  <script src="js/media-shelf.js?v=20261107-documentary-visibility-1"></script>
  <script src="js/medal-images.js?v=20261103-work-badges-2"></script>
  <script src="js/medals.js?v=20261104-storage-private-1"></script>
  <script src="js/episode-games.js?v=20261009-6"></script>
  <script src="js/pronunciation.js?v=20261009-1"></script>
  <script src="js/family.js?v=20261104-pone-homework-rewards-1"></script>
  <script src="js/word-sync.js?v=20261105-karaoke-practice-1"></script>
  <script src="js/karaoke-practice.js?v=20261105-karaoke-practice-1"></script>
  <script src="js/mobile-caption-fullscreen.js?v=20261105-mobile-caption-below-1"></script>

  <script src="js/movie-hub.js?v=20261029-1"></script>
  <script src="js/movie-library.js?v=20261107-library-refresh-1"></script>
  <script src="js/app.js?v=20261107-hp1-episode-vtt-1"></script>
  <script src="js/mobile-games.js?v=20261009-1"></script>
