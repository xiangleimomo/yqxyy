name: Publish pilot 101-103 from saved WhisperX timestamps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pilot-saved-alignment.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download completed recognition artifacts (no WhisperX rerun)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42085304718 --repo "${{ github.repository }}" --name three-episode-pilot-audit --dir saved-pilot
      - name: Generate and validate all three tracks with bounded estimates
        run: |
          python - <<'PY'
          import json, re, hashlib, unicodedata, xml.etree.ElementTree as ET
          from pathlib import Path
          from difflib import SequenceMatcher
          def norm(s): return ''.join(c for c in unicodedata.normalize('NFKC',s.lower()) if c.isalnum())
          def fmt(ms):
              h,r=divmod(max(0,ms),3600000);m,r=divmod(r,60000);s,ms=divmod(r,1000)
              return f'{h:02}:{m:02}:{s:02}.{ms:03}'
          def xmlwords(data):
              root=ET.fromstring(data);texts=[]
              for p in root.iter():
                  if p.tag.rsplit('}',1)[-1].lower()!='paragraph':continue
                  for c in p:
                      if c.tag.rsplit('}',1)[-1].lower()=='text':
                          texts.append(' '.join(c.itertext()));break
              clean=re.sub(r'\s+',' ',re.sub(r'\[n@(?:\])?',' ',' '.join(texts),flags=re.I)).strip()
              return [w for w in clean.split() if norm(w)],len(texts)
          base=Path('saved-pilot/whisperx-batch-results')
          out=Path('data/journey-to-the-west/subtitles');out.mkdir(parents=True,exist_ok=True)
          results=[]
          for eid in (101,102,103):
              d=base/f'journey-to-the-west-{eid}'
              report=json.loads((d/'alignment-report.json').read_text())
              canonical,paragraphs=xmlwords((d/'official-caption.xml').read_bytes())
              digest=hashlib.sha256(' '.join(canonical).encode()).hexdigest()
              assert digest==report['xmlTextSha256'],f'{eid}: XML hash mismatch'
              segments=json.loads((d/'forced-alignment-raw.json').read_text())
              found=[w for seg in segments for w in seg.get('words',[]) if norm(w.get('word',''))]
              a=[norm(w['word']) for w in found];b=[norm(w) for w in canonical]
              mapped=[None]*len(canonical)
              for tag,i,j,k,l in SequenceMatcher(None,a,b,autojunk=False).get_opcodes():
                  if tag=='equal' or (tag=='replace' and 0<j-i==l-k<=3 and
                    (i==0 or (k>0 and a[i-1]==b[k-1])) and
                    (j==len(a) or (l<len(b) and a[j]==b[l]))):
                      for off in range(j-i):
                          word=found[i+off]
                          if word.get('start') is None or word.get('end') is None:continue
                          s=round(float(word['start'])*1000);e=round(float(word['end'])*1000)
                          if 0<=s<e<=report['durationMs']+150 and e-s<=3500:
                              mapped[k+off]={'text':canonical[k+off],'startMs':s,'endMs':e,'source':'speech'}
              # Reject contradictory anchors, but preserve genuine word timestamps.
              last=-1
              for idx,w in enumerate(mapped):
                  if w is None:continue
                  if w['startMs']<last:mapped[idx]=None
                  else:last=w['startMs']
              speech=sum(w is not None for w in mapped)
              fraction=speech/len(mapped)
              assert fraction>=.90,f'{eid}: speech match {fraction:.2%} below 90%'
              # Fill gaps between genuine neighboring words, including longer gaps.
              # Mark estimated words, never count them toward real speech match.
              i=0
              while i<len(mapped):
                  if mapped[i] is not None:i+=1;continue
                  j=i
                  while j<len(mapped) and mapped[j] is None:j+=1
                  n=j-i
                  left=mapped[i-1] if i>0 else None
                  right=mapped[j] if j<len(mapped) else None
                  if left and right:
                      lo=left['endMs'];hi=right['startMs']
                      if hi<=lo:hi=lo+n*120
                  elif right:
                      hi=right['startMs'];lo=max(0,hi-n*200)
                  elif left:
                      lo=left['endMs'];hi=min(report['durationMs'],lo+n*200)
                  else:raise ValueError(f'{eid}: no timing anchors')
                  assert hi>lo and hi<=report['durationMs']+150
                  for off in range(n):
                      s=lo+round((hi-lo)*off/n);e=lo+round((hi-lo)*(off+1)/n)
                      if e<=s:e=s+1
                      mapped[i+off]={'text':canonical[i+off],'startMs':s,'endMs':e,'source':'estimated'}
                  i=j
              # Cue boundaries follow original XML punctuation, and each word is preserved.
              cues=[];start=0
              for i,w in enumerate(mapped):
                  if not ((re.search(r'[.!?]$',w['text']) and i-start>=1) or i-start>=17 or i==len(mapped)-1):continue
                  group=mapped[start:i+1]
                  cues.append({'startMs':group[0]['startMs'],'endMs':max(x['endMs'] for x in group),
                               'text':' '.join(x['text'] for x in group),'words':group})
                  start=i+1
              # Ensure valid cue intervals even around overlapping audio anchors.
              prev=0
              for cue in cues:
                  cue['startMs']=max(prev,cue['startMs'])
                  cue['endMs']=max(cue['startMs']+1,cue['endMs'])
                  prev=cue['endMs']
              vtt='WEBVTT\n\n'+'\n\n'.join(f"{n}\n{fmt(c['startMs'])} --> {fmt(c['endMs'])}\n{c['text']}" for n,c in enumerate(cues,1))+'\n'
              track={'seriesId':'journey-to-the-west','episodeId':eid,'sourceContentId':report['xmlContentId'],
                'mediaPath':report['mediaPath'],'mediaFingerprint':hashlib.sha256(report['mediaPath'].encode()).hexdigest(),
                'subtitleSha256':hashlib.sha256(vtt.encode()).hexdigest(),
                'method':'whisperx-asr-xml-text-only-forced-alignment','textAuthority':'littlefox-xml-paragraph-text',
                'xmlTextSha256':digest,'xmlParagraphCount':paragraphs,'recognizer':report['model'],
                'cueCount':len(cues),'totalWords':len(canonical),'speechMatchedWords':speech,
                'speechMatchedFraction':round(fraction,4),'cues':[{'words':c['words']} for c in cues]}
              (out/f'{eid:03}.vtt').write_text(vtt)
              (out/f'{eid:03}.words.json').write_text(json.dumps(track,ensure_ascii=False,indent=2)+'\n')
              results.append({'episodeId':eid,'speechMatchedFraction':round(fraction,4),'estimatedWords':len(mapped)-speech,'published':True})
          p=Path('reports/whisperx-three-episode-pilot-published.json')
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps({'sourceRunId':42085304718,'episodes':results},indent=2)+'\n')
          print(p.read_text())
          PY
      - name: Commit generated VTT and per-word karaoke tracks
        run: |
          git add data/journey-to-the-west/subtitles/{101,102,103}.vtt data/journey-to-the-west/subtitles/{101,102,103}.words.json reports/whisperx-three-episode-pilot-published.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish episodes 101-103 using saved speech timestamps and marked estimates"
          git pull --rebase origin main
          git push origin HEAD:main
