name: Review recent Little Fox subtitles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export scoped timed subtitles and audit public Read
        env:
          XET_ACCOUNT: ${{ secrets.XET_ACCOUNT }}
          XET_PASSWORD: ${{ secrets.XET_PASSWORD }}
        run: node scripts/import-recent-xet-vtt.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: recent-subtitle-review
          path: subtitle-review/
          retention-days: 3
