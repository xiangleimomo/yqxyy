name: Sync Little Fox catalogue

on:
  workflow_dispatch:
  schedule:
    # 15:00 Asia/Shanghai (UTC+8), Monday–Friday.
    - cron: '0 7 * * 1-5'

permissions:
  contents: write

jobs:
  sync:
    concurrency:
      group: little-fox-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize licensed catalogue
        env:
          XET_ACCOUNT: ${{ secrets.XET_ACCOUNT }}
          XET_PASSWORD: ${{ secrets.XET_PASSWORD }}
        run: node scripts/sync-little-fox.js --apply
      - name: Commit changes, if any
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sync Little Fox catalogue"
          git push
