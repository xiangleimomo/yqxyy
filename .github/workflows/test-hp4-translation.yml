name: Test HP4 subtitle translation
on:
  push:
    branches: [course/hp4-goblet-fire-20261107]
    paths:
      - 'scripts/test_hp4_translation_endpoint.py'
      - '.github/workflows/test-hp4-translation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test English to Simplified Chinese translation
        run: python3 scripts/test_hp4_translation_endpoint.py
