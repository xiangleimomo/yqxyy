name: Batch whole-site karaoke word timing
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum episodes to process in this run"
        type: string
        required: true
        default: "100"
      model:
        description: "Speech recognition model"
        type: choice
        options: [tiny.en, base.en]
        default: tiny.en
      retry_failed:
        description: "Retry episodes that failed in an earlier batch"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '0 18 * * *'
  push:
    paths:
      - scripts/subtitle-review/start-word-timing-batch.flag
permissions:
  contents: write
concurrency:
  group: yqxyy-word-karaoke-batch
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Build next whole-site batch
        id: plan
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
        run: |
          args=(--limit "$BATCH_SIZE" --output word-timing-targets.json)
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failed); fi
          python scripts/build-word-timing-manifest.py "${args[@]}"
          count=$(python -c "import json;print(len(json.load(open('word-timing-targets.json'))['lessons']))")
          echo "has_targets=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Selected $count lessons"
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_targets == 'true'
        with:
          name: word-timing-targets
          path: word-timing-targets.json
          retention-days: 3
  speech:
    needs: prepare
    if: needs.prepare.outputs.has_targets == 'true'
    continue-on-error: true
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: word-timing-targets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech recognition and FFmpeg
        run: |
          python -m pip install faster-whisper==1.2.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        with:
          path: /tmp/yqxyy-whisper-models
          key: ${{ runner.os }}-yqxyy-word-whisper-${{ github.event.inputs.model || 'tiny.en' }}-v1
      - name: Recognize speech and collect word timestamps
        env:
          MODEL: ${{ github.event.inputs.model || 'tiny.en' }}
        run: |
          python scripts/audit-subtitle-speech.py --manifest word-timing-targets.json --shard ${{ matrix.shard }} --shards 8 --model "$MODEL" --output speech-review --allow-failures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-review-${{ matrix.shard }}
          path: speech-review/
          if-no-files-found: warn
          retention-days: 3
  build:
    needs: [prepare, speech]
    if: always() && needs.prepare.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: speech-review-*
          path: speech-review
          merge-multiple: true
          if-no-files-found: warn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified per-word timing files
        run: |
          python -m py_compile scripts/build-word-timing-manifest.py scripts/audit-subtitle-speech.py scripts/build-word-timing.py
          node --check js/word-sync.js
          python scripts/build-word-timing.py --speech-root speech-review --apply --report reports/word-timing-batch-latest.json
      - name: Commit successful word timing files and batch report
        run: |
          git add data reports/word-timing-failures.json reports/word-timing-batch-latest.json
          if git diff --cached --quiet; then echo "No new word timing files to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate batch karaoke word timings"
          git push
