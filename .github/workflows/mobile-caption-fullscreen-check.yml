name: Mobile karaoke fullscreen checks
on:
  push:
    branches:
      - main
      - 'fix/mobile-karaoke-fullscreen-*'
    paths:
      - 'js/mobile-caption-fullscreen.js'
      - 'js/app.js'
      - 'css/style.css'
      - 'index.html'
      - 'tests/mobile-caption-fullscreen.test.cjs'
      - 'tests/mobile-caption-tray-display.test.cjs'
      - 'tests/movie-mobile-fullscreen.test.cjs'
      - '.github/workflows/mobile-caption-fullscreen-check.yml'
  pull_request:
    paths:
      - 'js/mobile-caption-fullscreen.js'
      - 'js/app.js'
      - 'css/style.css'
      - 'index.html'
      - 'tests/mobile-caption-fullscreen.test.cjs'
      - 'tests/mobile-caption-tray-display.test.cjs'
      - 'tests/movie-mobile-fullscreen.test.cjs'
      - '.github/workflows/mobile-caption-fullscreen-check.yml'
permissions:
  contents: read
jobs:
  mobile-karaoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app.js && node --check js/mobile-caption-fullscreen.js
      - run: node --test tests/mobile-caption-fullscreen.test.cjs tests/mobile-caption-tray-display.test.cjs tests/movie-mobile-fullscreen.test.cjs tests/word-sync-karaoke.test.cjs
