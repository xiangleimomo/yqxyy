name: Build Kung Fu Panda lesson assets on staging branch
on:
  push:
    branches: [automation/kfp9502-build]
    paths: [scripts/build-kfp9502-course.cjs]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/kfp9502-build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/build-kfp9502-course.cjs
      - name: Commit generated lesson assets on staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movie-kung-fu-panda-1
          git commit -m "Generate 13 Kung Fu Panda lesson playlists subtitles words and quizzes"
          git push origin HEAD:automation/kfp9502-build
