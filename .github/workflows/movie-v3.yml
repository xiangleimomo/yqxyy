name: yqxyy V3 TMDB Movie Auto Lessons
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Films to check in this batch (1-24)
        required: false
        default: '8'
      movie_id:
        description: Optional movie ID from catalog
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - scripts/movie-v3-auto-course.cjs
      - .github/workflows/movie-v3.yml
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
concurrency:
  group: yqxyy-movie-v3-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover TMDB source and produce verified native movie lessons
        env:
          V3_BATCH_SIZE: ${{ github.event_name == 'push' && '4' || (inputs.batch_size || '8') }}
          V3_MOVIE_ID: ${{ inputs.movie_id || '' }}
        run: node scripts/movie-v3-auto-course.cjs
      - name: Commit one complete movie batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data netlify.toml
          if git diff --cached --quiet; then
            echo "No new movie assets; no commit or deployment"
            exit 0
          fi
          git commit -m "V3 auto-publish native HLS movie lessons"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published batch commit $(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 3
          done
          echo "Failed to publish movie batch after retries"
          exit 1
