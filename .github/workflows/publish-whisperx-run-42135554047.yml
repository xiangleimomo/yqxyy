name: Publish validated 10 subtitles from archived run 42135554047
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-whisperx-run-42135554047.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: yqxyy-subtitle-publish-only
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download completed alignment artifacts (no WhisperX rerun)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42135554047 --repo "${{ github.repository }}" --pattern 'whisperx-results-*' --dir whisperx-batch-results
          gh run download 42135554047 --repo "${{ github.repository }}" --name whisperx-batch-targets --dir .
          find whisperx-batch-results -maxdepth 2 -type f | head
      - name: Merge shard folders and validate all 10 subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("whisperx-batch-results")
          folders=[p for p in root.iterdir() if p.is_dir() and p.name.startswith("whisperx-results-")]
          if not folders:
              raise RuntimeError("No source artifact shard folders")
          for folder in folders:
              for p in folder.iterdir():
                  dst=root/p.name
                  if dst.exists():
                      if p.is_dir():
                          shutil.copytree(p,dst,dirs_exist_ok=True)
                      else:
                          shutil.copy2(p,dst)
                  else:
                      shutil.move(str(p),str(dst))
              folder.rmdir()
          PY
          python scripts/publish-whisperx-read-batch.py --manifest whisperx-batch-targets.json --source whisperx-batch-results --run-id 42135554047
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("reports/whisperx-read-batches/42135554047.json").read_text())
          print("validated",x["published"],"rejected",x["rejected"])
          if x["published"]!=10 or x["rejected"]!=0:
              raise SystemExit("Unexpected incomplete recovery")
          PY
      - name: Commit without replaying obsolete latest-report conflicts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*/subtitles/*.vtt data/*/subtitles/*.words.json reports/whisperx-read-batches/42135554047.json reports/whisperx-read-batch-latest.json reports/whisperx-read-failures.json
          if git diff --cached --quiet; then
            echo "No changes; already published."
            exit 0
          fi
          git commit -m "Publish 10 verified subtitles from run 42135554047 without re-ASR"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
