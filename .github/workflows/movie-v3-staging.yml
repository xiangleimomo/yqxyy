name: V3 movie course source test (staging)
on:
  push:
    branches: [automation/movie-v3-source-pipeline]
    paths:
      - scripts/movie-v3-auto-course.cjs
      - .github/workflows/movie-v3-staging.yml
permissions:
  contents: write
  models: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/movie-v3-source-pipeline
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GitHub Models editorial availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          (async()=>{
            const r=await fetch('https://models.github.ai/inference/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+process.env.GITHUB_TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github+json'},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[{role:'user',content:'Reply only YES.'}],max_tokens:20})});
            const text=await r.text();console.log('V3_MODEL_SMOKE',r.status,text.slice(0,400));
          })().catch(e=>{console.warn('MODEL_UNAVAILABLE',e.message);});
          NODE
      - name: Generate first native-source lesson series
        env:
          V3_BATCH_SIZE: '1'
          V3_MOVIE_ID: harry-potter-philosophers-stone
        run: node scripts/movie-v3-auto-course.cjs
      - name: Commit source-verified course on staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data netlify.toml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage V3 source-native movie lessons pilot"
          git push origin HEAD:automation/movie-v3-source-pipeline
