name: Publish archived 98 subtitles without rerunning WhisperX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/subtitle-review/publish-archive.flag'
permissions:
  contents: write
  actions: read
concurrency:
  group: yqxyy-archived-subtitles
  cancel-in-progress: false
jobs:
  publish-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download existing ten WhisperX shards from run 42072397000
        uses: actions/download-artifact@v4
        with:
          run-id: 42072397000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: whisperx-results-*
          path: whisperx-archive-zips
      - name: Build captions directly from archived alignment
        run: |
          python -m py_compile scripts/publish-archived-whisperx.py
          python scripts/publish-archived-whisperx.py
          git diff --check
      - name: Publish every threshold-qualified VTT and words JSON
        run: |
          git add data/journey-to-the-west/subtitles/*.vtt data/journey-to-the-west/subtitles/*.words.json reports/whisperx-archive-threshold-release.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish archived WhisperX subtitles passing 90 percent threshold'
          git pull --rebase origin main
          git push origin HEAD:main
