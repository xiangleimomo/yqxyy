name: Verify official Three Kingdoms episode 13 captions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-three-kingdoms-13-caption.yml'

permissions:
  contents: write

jobs:
  caption:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: three-kingdoms-13-official-caption
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate importer
        run: python -m py_compile scripts/import-official-captions.py
      - name: Verify actual official XML parser and millisecond units
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('captions','scripts/import-official-captions.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          url,body=mod.download('C0013409')
          cues=mod.parse_xml(body)
          assert len(cues)==61, f'Expected 61 official cues, got {len(cues)}'
          assert cues[0]['startMs']==46 and cues[0]['endMs']==8443, 'Official millisecond parsing incorrect'
          assert cues[-1]['endMs']==344977, 'Unexpected original timebase'
          print('Verified: 61 official XML cues with native millisecond timing')
          PY
      - name: Fetch real C0013409 XML and apply verified time codes
        id: capture
        shell: bash
        run: |
          set +e
          python scripts/import-official-captions.py --lesson three-kingdoms:13 --apply --strict > /tmp/caption-13-result.log 2>&1
          CODE=$?
          set -e
          cat /tmp/caption-13-result.log
          echo "return_code=$CODE" >> "$GITHUB_OUTPUT"
          if test "$CODE" -ne 0; then
            mkdir -p reports
            python - <<'PY'
          import json
          from pathlib import Path
          lines=Path('/tmp/caption-13-result.log').read_text(encoding='utf8').splitlines()
          rows=[]
          for line in lines:
              try: rows.append(json.loads(line))
              except ValueError: continue
          metadata={}
          try:
              import urllib.request, xml.etree.ElementTree as ET
              from collections import Counter
              u='https://cdn.littlefox.com/contents/caption/C0013409.xml'
              req=urllib.request.Request(u,headers={'User-Agent':'yqxyy-caption-sync/1.0'})
              with urllib.request.urlopen(req,timeout=18) as response:
                  content=response.read(300000)
              root=ET.fromstring(content)
              names=lambda elem: elem.tag.rsplit('}',1)[-1]
              all_nodes=list(root.iter())
              metadata['rootTag']=names(root)
              metadata['tagCounts']=dict(Counter(names(e) for e in all_nodes).most_common(30))
              metadata['sampleNodes']=[]
              sampled={}
              for e in all_nodes:
                  tag=names(e)
                  if sampled.get(tag,0)>=3:continue
                  sampled[tag]=sampled.get(tag,0)+1
                  metadata['sampleNodes'].append({
                    'tag':tag,
                    'attributes':dict(list(e.attrib.items())[:12]),
                    'childTags':[names(c) for c in list(e)[:8]],
                    'textPreview':(' '.join(e.itertext())).strip()[:95]
                  })
                  if len(metadata['sampleNodes'])>=35:break
          except Exception as error:
              metadata['inspectionError']=str(error)
          payload={'contentId':'C0013409','status':'needs-review','results':rows,'xmlStructure':metadata}
          Path('reports/three-kingdoms-13-xml-check.json').write_text(
              json.dumps(payload,indent=2,ensure_ascii=False)+'\n',
              encoding='utf8'
          )
          PY
          fi
      - name: Publish corrected VTT or diagnostic report
        shell: bash
        run: |
          git add data/three-kingdoms/subtitles/013.vtt
          if test -f data/three-kingdoms/subtitles/013.timing.json; then
            git add data/three-kingdoms/subtitles/013.timing.json
          fi
          if test -f reports/three-kingdoms-13-xml-check.json; then
            git add reports/three-kingdoms-13-xml-check.json
          fi
          if git diff --cached --quiet; then
            echo 'No updated subtitle or diagnostic.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify Three Kingdoms episode 13 official XML subtitle timing"
          git push
      - name: Signal pending verification
        if: steps.capture.outputs.return_code != '0'
        run: exit 1
