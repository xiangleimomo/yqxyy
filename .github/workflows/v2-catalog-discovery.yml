name: yqxyy V2 catalogue discovery
on:
  push:
    branches: [main]
    paths:
      - data/movie-hub-catalog.json
      - js/supabase-config.js
      - scripts/v2-catalog-scan.cjs
      - .github/workflows/v2-catalog-discovery.yml
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yqxyy-v2-catalog-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scanner
        run: node --check scripts/v2-catalog-scan.cjs
      - name: Discover films and published TV catalogue entries
        run: node scripts/v2-catalog-scan.cjs
      - name: Commit queue state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v2-engine-state.json
          if git diff --cached --quiet; then
            echo "V2 catalogue unchanged"
            exit 0
          fi
          git commit -m "V2: sync film and TV catalogue queue"
          git push origin HEAD:main
