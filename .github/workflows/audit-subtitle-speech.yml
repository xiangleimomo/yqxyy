name: Audit Little Fox subtitle speech timing
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Validated audio review scope"
        type: choice
        options: [timing, binding-samples, placeholder-speech, extended-placeholders, placeholder-retry]
        default: timing
      model:
        description: "Speech recognizer for independent timestamp evidence"
        type: choice
        options: [tiny.en, base.en]
        default: tiny.en
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install faster-whisper==1.2.1
      - name: Install system audio decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Compare actual video speech against timed captions
        env:
          SPEECH_SCOPE: ${{ inputs.scope }}
        run: python scripts/audit-subtitle-speech.py --manifest scripts/subtitle-review/2026-10-28-targets.json --shard ${{ matrix.shard }} --shards 4 --model "${{ inputs.model }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-review-${{ matrix.shard }}
          path: speech-review/
          retention-days: 3
