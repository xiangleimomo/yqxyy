name: Audit Little Fox subtitle speech timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install faster-whisper==1.2.1 imageio-ffmpeg==0.6.0
      - name: Compare actual video speech against timed captions
        run: python scripts/audit-subtitle-speech.py --manifest scripts/subtitle-review/2026-10-28-targets.json --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-review-${{ matrix.shard }}
          path: speech-review/
          retention-days: 3
