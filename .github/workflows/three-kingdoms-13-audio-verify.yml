name: One-time Three Kingdoms Episode 13 audio timing verification
on:
  push:
    branches:
      - fix/three-kingdoms-13-timing
    paths:
      - .github/workflows/three-kingdoms-13-audio-verify.yml
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech recognizer and audio decoder
        run: |
          python -m pip install faster-whisper==1.2.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Obtain timing evidence from current episode 13 media
        run: |
          cat > /tmp/episode13.json <<'JSON'
          {"lessons":[{"seriesId":"three-kingdoms","episodeId":13,"hlsUrl":"https://cdn.littlefox.co.kr/contents_5/hls/720/6a4409a7d1/1793066883251ea3991fd165bfd231aa53cd439968/stream.m3u8"}]}
          JSON
          sed -i "s/choices=\['tiny.en','base.en'\]/choices=['tiny.en','base.en','small.en']/" scripts/audit-subtitle-speech.py
          python scripts/audit-subtitle-speech.py --manifest /tmp/episode13.json --model small.en --shard 0 --shards 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-kingdoms-13-speech-evidence
          path: speech-review/
          retention-days: 1
