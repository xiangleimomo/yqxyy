<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哈利波特1 · 独立英语课程</title><style>body{background:#101827;color:#f5f7ff;font:16px system-ui;margin:0;padding:18px}main{max-width:950px;margin:auto}a{color:#a9d8ff}video{width:100%;background:#000;aspect-ratio:16/9;border-radius:12px}button{padding:12px;border:1px solid #63758b;border-radius:9px;background:#263c59;color:white;cursor:pointer}button:disabled{opacity:.5}article{border:1px solid #35445a;border-radius:12px;padding:14px;margin:12px 0}small,.muted{color:#b6c5d9}.notice{background:#263248;padding:12px;border-radius:8px}#status{min-height:1.5em}</style></head><body><main><p><a href="/#/movies">← 光影课堂</a></p><h1>哈利·波特与魔法石</h1><h2>独立英语学习课程 · 制作预览</h2><p class="notice">这是新课程草稿，与原有24集完全独立。视频使用新直链。下方剧情章节尚未完成字幕时间轴校准，因此暂不支持按章节精确跳转；练习题也只是初稿。</p><video id="video" controls playsinline preload="metadata"></video><p><button id="play">加载影片</button> <a href="https://api.obj2.top/hls/movie/671/master.m3u8" target="_blank" rel="noopener">手机浏览器直接播放</a></p><p id="status" aria-live="polite"></p><h2>剧情章节（待校准）</h2><section id="chapters"></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>
const url="https://api.obj2.top/hls/movie/671/master.m3u8",video=document.getElementById('video'),status=document.getElementById('status');let hls;
document.getElementById('play').onclick=()=>{if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(e=>status.textContent=e.message);}else if(window.Hls?.isSupported()){hls?.destroy();hls=new Hls();hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(e=>status.textContent=e.message));hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal)status.textContent='视频加载失败：'+d.details});hls.loadSource(url);hls.attachMedia(video)}else status.textContent='当前浏览器不支持网页内嵌HLS，请用上方直链播放。'};
fetch('/data/movie-hp1-independent/course.json').then(r=>r.json()).then(data=>{document.getElementById('chapters').replaceChildren(...data.chapters.map(c=>{const a=document.createElement('article');const h=document.createElement('h3');h.textContent='Episode '+c.episodeId+' · '+c.title+' / '+c.titleZh;const p=document.createElement('p');p.textContent=c.summaryEn;const w=document.createElement('p');w.textContent='Vocabulary: '+c.words.join(' · ');const q=document.createElement('p');q.textContent='Question (draft): '+c.sampleQuestion.question+' Answer: '+c.sampleQuestion.answer;const t=document.createElement('small');t.textContent='时间点待字幕校准';a.append(h,p,w,q,t);return a}))}).catch(()=>status.textContent='课程草稿读取失败');
window.addEventListener('pagehide',()=>hls?.destroy());
</script></body></html>
