<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哈利波特1 · 独立英语课程</title><style>body{background:#101827;color:#f5f7ff;font:16px system-ui;margin:0;padding:18px}main{max-width:950px;margin:auto}a{color:#a9d8ff}video{width:100%;background:#000;aspect-ratio:16/9;border-radius:12px}button{padding:12px;border:1px solid #63758b;border-radius:9px;background:#263c59;color:white;cursor:pointer}button:disabled{opacity:.5}article{border:1px solid #35445a;border-radius:12px;padding:14px;margin:12px 0}small,.muted{color:#b6c5d9}.notice{background:#263248;padding:12px;border-radius:8px}#status{min-height:1.5em}</style></head><body><main><p><a href="/#/movies">← 光影课堂</a></p><h1>哈利·波特与魔法石</h1><h2>独立英语学习课程 · 制作预览</h2><p class="notice">这是新课程草稿，与原有24集完全独立。视频使用新直链。新课程采用24个剧情分集，每集独立观看。24集现已开放分段播放；目前采用粗略时间划分，片段起止位置可能偏离剧情，后续会继续校准。</p><video id="video" controls playsinline preload="metadata"></video><p><button id="play">加载影片</button> <a href="https://api.obj2.top/hls/movie/671/master.m3u8" target="_blank" rel="noopener">手机浏览器直接播放</a></p><p id="status" aria-live="polite"></p><h2>24集剧情分集</h2><p id="clip-state" class="muted">选择已校准分集后，将只播放该集片段。</p><section id="chapters"></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>
const url="https://api.obj2.top/hls/movie/671/master.m3u8",video=document.getElementById('video'),status=document.getElementById('status');let hls;
document.getElementById('play').onclick=()=>{if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play().catch(e=>status.textContent=e.message);}else if(window.Hls?.isSupported()){hls?.destroy();hls=new Hls();hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(e=>status.textContent=e.message));hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal)status.textContent='视频加载失败：'+d.details});hls.loadSource(url);hls.attachMedia(video)}else status.textContent='当前浏览器不支持网页内嵌HLS，请用上方直链播放。'};
let activeClip=null;const clipState=document.getElementById('clip-state');const toTime=t=>{const m=Math.floor(t/60),sec=Math.floor(t%60);return m+':'+String(sec).padStart(2,'0')};function seekClip(c){activeClip=c;const jump=()=>{video.currentTime=c.start;video.play().catch(e=>clipState.textContent=e.message)};if(video.readyState>=1)jump();else{document.getElementById('play').click();video.addEventListener('loadedmetadata',jump,{once:true})}clipState.textContent='正在播放第'+c.episodeId+'集 · '+toTime(c.start)+'–'+toTime(c.end)}video.addEventListener('timeupdate',()=>{if(activeClip&&video.currentTime>=activeClip.end){video.pause();video.currentTime=activeClip.end;clipState.textContent='本集播放结束'}});video.addEventListener('seeking',()=>{if(activeClip&&video.currentTime<activeClip.start-0.5||activeClip&&video.currentTime>activeClip.end+0.5){activeClip=null;clipState.textContent='已退出分集片段，正在播放完整影片'}});fetch('/data/movie-hp1-independent/course.json').then(r=>r.json()).then(data=>{document.getElementById('chapters').replaceChildren(...data.chapters.map(c=>{const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),btn=document.createElement('button');h.textContent='第'+c.episodeId+'集 · '+c.titleZh+' / '+c.title;p.textContent=c.summaryEn||'剧情分集，待字幕与时间轴校准。';const ready=(c.verified===true||c.timingQuality==='estimated')&&Number.isFinite(c.start)&&Number.isFinite(c.end)&&c.end>c.start;btn.textContent=ready?'播放本集 · '+toTime(c.start)+'–'+toTime(c.end)+(c.timingQuality==='estimated'?'（预估）':''):'片段时间校准中';btn.disabled=!ready;if(ready)btn.onclick=()=>seekClip(c);a.append(h,p,btn);return a}))}).catch(()=>status.textContent='课程数据读取失败');window.addEventListener('pagehide',()=>hls?.destroy());
</script><section style="padding:16px;border:1px solid #445;border-radius:12px"><h2>英文字幕候选</h2><button id="subSearch">搜索英文字幕</button> <select id="subList"><option>尚未搜索</option></select> <button id="subLoad">加载字幕</button><p><label>字幕时间偏移（秒）：<input id="subtitleOffset" type="number" value="0" step="0.1" min="-600" max="600" style="width:90px"></label> <button id="subtitleApplyOffset" type="button">应用偏移</button></p><p id="subInfo"></p></section><script src="/js/hp1-subtitle-lookup.js"></script></body></html>
