<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哈利·波特与魔法石 · 34集动画故事式课程</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1525;color:#f5f7fb;font:15px system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:20px}a{color:#b6d9ff;text-decoration:none}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero{padding:20px 0 10px}h1{font-size:clamp(25px,4vw,38px);margin:12px 0 5px}h2{font-size:20px;margin:25px 0 12px}.muted{color:#a8b8cc}.player{background:#151f32;border:1px solid #2d405b;border-radius:18px;padding:12px}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}button{font:inherit;border:1px solid #456080;border-radius:9px;padding:10px 14px;color:#fff;background:#27476c;cursor:pointer}button:hover{background:#35638d}button:focus-visible{outline:3px solid #83c3ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px}.episode{background:#17243a;border:1px solid #314661;border-radius:15px;overflow:hidden;text-align:left;padding:0;transition:transform .15s}.episode:hover{transform:translateY(-2px)}.episode.active{border:2px solid #7ac0ff}.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#263f66,#101a30);display:flex;align-items:center;justify-content:center;position:relative}.thumb b{font-size:42px;opacity:.35}.thumb em{position:absolute;right:10px;bottom:10px;font-style:normal;background:#000b;border-radius:6px;padding:3px 7px;font-size:12px}.body{padding:13px}.body strong{display:block;font-size:15px;margin-bottom:7px}.body p{font-size:13px;line-height:1.5;color:#b9c8dc;margin:0;min-height:39px}.notice{font-size:13px;color:#c7d5e7}.sub{margin-top:25px;padding:16px;border:1px solid #30415a;border-radius:14px}input,select{background:#18273e;color:#fff;border:1px solid #51657d;border-radius:8px;padding:9px}#status,#clip-state,#subInfo{min-height:1.4em}</style></head><body><main><div class="top"><a href="/#/movies">← 返回光影课堂</a><span class="muted">影视英语 · 剧情分集</span></div><div class="hero"><h1>哈利·波特与魔法石</h1><p class="muted">Harry Potter and the Sorcerer's Stone · 34集剧情故事</p></div><div class="player"><video id="video" controls playsinline preload="metadata"></video><div class="toolbar"><button id="play" type="button">加载完整影片</button><span id="clip-state" class="muted">选择下方一集开始观看</span></div><p id="status" class="notice" aria-live="polite"></p></div><h2>剧情选集 <span class="muted" style="font-size:14px;font-weight:400">共34集 · 点击卡片播放</span></h2><section id="chapters" class="grid" aria-label="剧情分集"></section><p class="notice">按照英文字幕剧情划分34集；视频采用原始M3U8的时间区间播放，不重新编码。切点尚未逐帧核对，字幕与片源的时间差可手动调整。</p><section class="sub"><h2>字幕与同步</h2><div class="toolbar"><button id="subSearch" type="button">搜索备用英文字幕</button><select id="subList"><option value="">尚未搜索</option></select><button id="subLoad" type="button">加载备用字幕</button></div><div class="toolbar"><label>字幕偏移（秒） <input id="subtitleOffset" type="number" value="0" step="0.1" min="-600" max="600" style="width:95px"></label><button id="subtitleApplyOffset" type="button">应用字幕偏移</button><button id="subtitleExport" type="button">保存VTT</button></div><p id="subInfo" class="notice"></p></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>const url="https://api.obj2.top/hls/movie/671/master.m3u8",video=document.getElementById('video'),status=document.getElementById('status'),clipState=document.getElementById('clip-state');let hls=null,activeClip=null,selected=null;const fmt=s=>{s=Math.round(s);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':')};function loadVideo(){if(video.currentSrc||hls)return;if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=url;else if(window.Hls?.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_e,d)=>{if(d.fatal)status.textContent='播放失败：'+d.details})}else status.textContent='浏览器不支持HLS播放'}document.getElementById('play').onclick=()=>{activeClip=null;loadVideo();video.play().catch(e=>status.textContent=e.message)};function playClip(c){activeClip=c;selected=c.episodeId;document.querySelectorAll('.episode').forEach(el=>el.classList.toggle('active',Number(el.dataset.id)===selected));clipState.textContent='正在播放第'+c.episodeId+'集 · '+c.titleZh;loadVideo();const jump=()=>{video.currentTime=c.start;video.play().catch(e=>status.textContent=e.message)};if(video.readyState>=1)jump();else video.addEventListener('loadedmetadata',jump,{once:true});document.querySelector('.player').scrollIntoView({behavior:'smooth',block:'start'})}video.addEventListener('timeupdate',()=>{if(activeClip&&video.currentTime>=activeClip.end){video.pause();activeClip=null;clipState.textContent='本集播放结束，可选择下一集'}});video.addEventListener('seeking',()=>{if(activeClip&&(video.currentTime<activeClip.start-1||video.currentTime>activeClip.end+1)){activeClip=null;clipState.textContent='已切换到完整影片播放'}});fetch('/data/movie-hp1-independent/course.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('chapters').replaceChildren(...d.chapters.map(c=>{const btn=document.createElement('button');btn.className='episode';btn.dataset.id=c.episodeId;btn.type='button';btn.setAttribute('aria-label','播放第'+c.episodeId+'集 '+c.titleZh);const thumb=document.createElement('div');thumb.className='thumb';const n=document.createElement('b');n.textContent=String(c.episodeId).padStart(2,'0');const t=document.createElement('em');t.textContent=fmt(c.end-c.start).replace(/^00:/,'');thumb.append(n,t);const body=document.createElement('div');body.className='body';const h=document.createElement('strong');h.textContent='第'+c.episodeId+'集 · '+c.titleZh;const p=document.createElement('p');p.textContent=c.summaryZh||'';body.append(h,p);btn.append(thumb,body);btn.onclick=()=>playClip(c);return btn}))}).catch(e=>status.textContent='课程读取失败：'+e.message);window.addEventListener('pagehide',()=>hls?.destroy());</script><script src="/js/hp1-subtitle-lookup.js"></script></body></html>
