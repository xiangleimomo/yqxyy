[build]
  publish = "."

[[headers]]
  for = "/data/movie-harry-potter-1/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[functions."source-explorer-api"]
  included_files = ["source-lab/providers.json", "source-lab/subtitle-films.json"]

[functions."movie-study-subtitles"]
  included_files = ["data/movie-harry-potter-1/alignment.json"]

[[headers]]
  for = "/data/movie-harry-potter-2/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"
