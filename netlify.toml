[build]
  publish = "."

# Reader libraries have versioned directory names; reuse them on mobile visits.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fixed upstream only; keep before the SPA catch-all. A 200 rewrite proxies
# manifests and relative HLS assets without a cross-origin browser request.
[[redirects]]
  from = "/_movie-media/bluevelvet/*"
  to = "https://zcdn1.6azt0hwr-cf9.workers.dev/play/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[functions."source-explorer-api"]
  included_files = ["source-lab/providers.json", "source-lab/subtitle-films.json"]

[functions."movie-study-subtitles"]
  included_files = ["data/movie-harry-potter-1/alignment.json"]

[functions."movie-stream"]
  included_files = ["data/movie-hub-catalog.json"]

[[headers]]
  for = "/data/movie-harry-potter-1/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/data/movie-harry-potter-2/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/data/movie-harry-potter-3/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/data/movie-harry-potter-4/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/data/movie-kung-fu-panda-1/hls/*"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"
